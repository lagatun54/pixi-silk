name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        # lint rules, formatting and import order; annotates the PR diff
        run: pnpm exec biome ci --reporter=github --reporter=default .

      - name: Writing style
        # plain ASCII punctuation, no hype or filler words, short sentences in the docs
        run: pnpm lint:prose

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter pixi-silk test

      - name: Build library
        run: pnpm build

      - name: Publish contents
        run: pnpm check:publish-contents

      - name: Build docs site
        run: pnpm site:build

  changeset-gate:
    # Library source changed but no changeset added. Escape hatch: the `skip-changeset` label.
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
      && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a changeset for library changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- 'packages/pixi-silk/src/**' 'packages/pixi-silk/package.json' | grep -q .; then
            added=$(git diff --name-only --diff-filter=A "$base" "$head" -- '.changeset/*.md' | grep -vE '(^|/)README\.md$' || true)
            if [ -z "$added" ]; then
              echo "::error::This PR changes packages/pixi-silk but adds no .changeset/*.md. Run 'pnpm changeset' or add the 'skip-changeset' label."
              exit 1
            fi
          fi
