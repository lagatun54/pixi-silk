# nginx for the pixi-silk docs site (static Astro build, trailingSlash: 'always').

map $uri $cache_control {
    default                         "public, max-age=0, must-revalidate";
    ~^/_astro/                      "public, max-age=31536000, immutable";
    ~^/fonts/                       "public, max-age=31536000, immutable";
    ~^/pagefind/                    "public, max-age=3600";
    ~^/(og|showcase|refs)/          "public, max-age=604800";
    ~*\.(png|jpe?g|webp|avif|svg|ico)$ "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown text/css text/xml application/javascript application/json application/xml application/manifest+json application/opensearchdescription+xml image/svg+xml;

    # redirects stay relative: TLS is terminated in front of this container
    absolute_redirect off;
    server_tokens off;

    # compressed copies are produced at build time (scripts/precompress.mjs); gzip the rest on the fly
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/markdown text/css text/xml application/javascript application/json application/xml application/manifest+json application/opensearchdescription+xml image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # /docs/shapes/index.html -> /docs/shapes/ ($request_uri is the original request, so the index
    # lookups nginx makes internally are never redirected)
    if ($request_uri ~ ^([^?]*/)index\.html(\?.*)?$) {
        return 301 $1$2;
    }

    # never serve dotfiles (e.g. .htaccess meant for Apache hosting); /.well-known/ stays reachable
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # markdown twins of the docs and the LLM files are text for machines
    location ~ ^/llms(-full)?\.txt$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location ~ ^/docs/[^/]+\.md$ {
        # an empty types map makes default_type apply (a server-level types{} would replace mime.types)
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # types missing from nginx's mime.types
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /opensearch.xml {
        types { }
        default_type application/opensearchdescription+xml;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # one URL per page: /docs/shapes -> /docs/shapes/ (paths without a file extension)
    location ~ ^(?<path>/[^.]*[^/.])$ {
        if (-d $document_root$path) {
            return 301 $path/$is_args$args;
        }
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
